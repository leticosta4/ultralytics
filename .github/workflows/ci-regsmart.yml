# Ultralytics YOLO Continuous Integration (CI) GitHub Actions tests

name: CI regsmart

permissions:
  contents: read

env:
  PYTHONFAULTHANDLER: 1
  REGSMART_PACKAGE: "git+https://github.com/leticosta4/pytest-regsmart@f15d254252bcdb8fe0b34bb0fd8b4468f63cd0d2"

on:
  pull_request:
  workflow_dispatch:

jobs:
  Tests-regsmart:
    name: regsmart (${{ matrix.mode }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: [latest]
        mode: [rgsm_qtf, rgsm_recentfail, rgsm_hybrid]
        include:
            - mode: rgsm_qtf
              weight: "1-0"
            - mode: rgsm_recentfail
              weight: "0-1"
            - mode: rgsm_hybrid
              weight: "1-1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ultralytics/actions/setup-uv@main
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install requirements
        run: |
          torch=""
          if [ "${{ matrix.torch }}" != "latest" ]; then
              torch="torch==${{ matrix.torch }} torchvision==${{ matrix.torchvision }}"
          fi
          uv pip install -e ".[export-base,export-openvino,solutions]" \
            $torch aiohttp pytest-cov pytest-xdist "git+https://github.com/ultralytics/CLIP.git" \
            --torch-backend cpu
      - name: Install pytest-regsmart
        run: |
          uv pip install "$REGSMART_PACKAGE"
          uv pip freeze
      - name: Check environment
        run: |
          yolo checks
          uv pip list
      - name: Configure Ultralytics cache paths
        run: yolo settings weights_dir="${GITHUB_WORKSPACE}/.ultralytics_cache/weights" datasets_dir="${GITHUB_WORKSPACE}/.ultralytics_cache/datasets"
      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ultralytics_cache
          key: ultralytics-test-assets-${{ runner.os }}-${{ hashFiles('tests/cache_test_assets.py', 'tests/__init__.py')}}
          restore-keys: |
            ultralytics-test-assets-${{ runner.os }}-
      - name: Install reportlog
        run: uv pip install pytest-reportlog
      - name: Pre-cache test assets
        run: python tests/cache_test_assets.py
      - name: Restore pytest-regsmart cache
        id: restore-pytest-regsmart-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranked_selection_data
          key: pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}
          restore-keys: |
            pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-
      - name: Pytest tests regsmart
        run: pytest -n auto --report-log=reportlog.jsonl --regsmart --ranking-weight=${{ matrix.weight }} --dist=loadfile --cov=ultralytics/ --cov-report=xml tests/ --export-env base
        env:
          YOLO_AUTOINSTALL: "false"
      - name: Save pytest-regsmart cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranked_selection_data
          key: pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-${{ github.run_id }}
      - name: Prune uv Cache
        run: uv cache prune --ci
      - name: Upload report-log
        if: ${{ !cancelled() }}   # com mutante o step de teste falha; sem isso o arquivo não sobe
        uses: actions/upload-artifact@v4
        with:
          name: reportlog-${{ matrix.mode }}   # sem matriz: reportlog-main
          path: reportlog.jsonl
          retention-days: 14
          if-no-files-found: warn
