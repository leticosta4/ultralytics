# Ultralytics YOLO Continuous Integration (CI) GitHub Actions tests

name: CI

permissions:
  contents: read

env:
  PYTHONFAULTHANDLER: 1

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *" # runs at 08:00 UTC every day
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Run Benchmarks"
        default: true
        type: boolean
      tests:
        description: "Run Tests"
        default: true
        type: boolean

jobs:
  Tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.13"]
        torch: [latest]
        include:
          - os: ubuntu-latest
            python: "3.8" # torch 1.8.0 requires python >=3.6, <=3.9
            torch: "1.8.0"
            torchvision: "0.9.0"
    steps:
      - uses: actions/checkout@v7
      - uses: ultralytics/actions/setup-uv@main
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install requirements
        shell: bash # for Windows compatibility
        run: |
          slow=""
          torch=""
          if [ "${{ matrix.torch }}" != "latest" ]; then
              torch="torch==${{ matrix.torch }} torchvision==${{ matrix.torchvision }}"
          fi
          uv pip install -e ".[export-base,export-openvino,solutions]" \
            $torch aiohttp pytest-cov pytest-xdist "git+https://github.com/ultralytics/CLIP.git" \
            --torch-backend cpu
      - name: Check environment
        run: |
          yolo checks
          uv pip list
      - name: Configure Ultralytics cache paths
        shell: bash # for Windows compatibility
        run: yolo settings weights_dir="${GITHUB_WORKSPACE}/.ultralytics_cache/weights" datasets_dir="${GITHUB_WORKSPACE}/.ultralytics_cache/datasets"
      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ultralytics_cache
          key: ultralytics-test-assets-${{ runner.os }}-${{ hashFiles('tests/cache_test_assets.py', 'tests/__init__.py') }}
          restore-keys: |
            ultralytics-test-assets-${{ runner.os }}-
      - name: Pre-cache test assets
        shell: bash # for Windows compatibility
        run: python tests/cache_test_assets.py
      - name: Pytest tests
        shell: bash # for Windows compatibility
        # GitHub-hosted ARM runners have disconnected under xdist auto-parallelism: ubuntu-24.04-arm runs
        # single-process, and the 3-vCPU/7GB macos-26 runners cap at 2 workers to avoid memory starvation.
        run: |
          xdist="-n auto --dist=loadfile"
          [[ "${{ matrix.os }}" == "macos-26" ]] && xdist="-n 2 --dist=loadfile"
          [[ "${{ matrix.os }}" == "ubuntu-24.04-arm" ]] && xdist=""
          pytest $xdist --cov=ultralytics/ --cov-report=xml tests/ --export-env base
        env:
          YOLO_AUTOINSTALL: "false"
      - name: Upload Coverage Reports to CodeCov
        if: github.repository == 'ultralytics/ultralytics' # && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          flags: Tests
          fail_ci_if_error: false
          use_oidc: true
      - name: Prune uv Cache
        run: uv cache prune --ci
