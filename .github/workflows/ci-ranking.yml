# Ultralytics YOLO Continuous Integration (CI) GitHub Actions tests

name: CI ranking

permissions:
  contents: read

env:
  PYTHONFAULTHANDLER: 1
  RANKING_PACKAGE: "pytest-ranking"

on:
  pull_request:
  workflow_dispatch:

jobs:
  Tests-ranking:
    name: ranking (${{ matrix.mode }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: [latest]
        mode: [rkn_qtf, rkn_recentfail, rkn_simchgpath, rkn_hybrid]
        include:
            - mode: rkn_qtf
              weight: "1-0-0"
            - mode: rkn_recentfail
              weight: "0-1-0"
            - mode: rkn_simchgpath
              weight: "0-0-1"
            - mode: rkn_hybrid
              weight: "1-1-1"
    steps:
      - uses: actions/checkout@v7
      - uses: ultralytics/actions/setup-uv@main
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install requirements
        run: |
          torch=""
          if [ "${{ matrix.torch }}" != "latest" ]; then
              torch="torch==${{ matrix.torch }} torchvision==${{ matrix.torchvision }}"
          fi
          uv pip install -e ".[export-base,export-openvino,solutions]" \
            $torch aiohttp pytest-cov pytest-xdist "git+https://github.com/ultralytics/CLIP.git" \
            --torch-backend cpu
      - name: Install pytest-ranking
        run: |
          uv pip install "$RANKING_PACKAGE"
          uv pip freeze
      - name: Check environment
        run: |
          yolo checks
          uv pip list
      - name: Configure Ultralytics cache paths
        run: yolo settings weights_dir="${GITHUB_WORKSPACE}/.ultralytics_cache/weights" datasets_dir="${GITHUB_WORKSPACE}/.ultralytics_cache/datasets"
      - name: Install reportlog
        run: uv pip install pytest-reportlog
      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ultralytics_cache
          key: ultralytics-test-assets-${{ runner.os }}-${{ hashFiles('tests/cache_test_assets.py', 'tests/__init__.py')}}
          restore-keys: |
            ultralytics-test-assets-${{ runner.os }}-
      - name: Pre-cache test assets
        run: python tests/cache_test_assets.py
      - name: Restore pytest-ranking cache
        id: restore-pytest-ranking-cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranking_data
          key: pytest-ranking-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}
          restore-keys: |
            pytest-ranking-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-
      - name: Pytest tests ranking
        run: pytest -n auto --report-log=reportlog.jsonl --rank --rank-weight=${{ matrix.weight }} --dist=loadfile --cov=ultralytics/ --cov-report=xml tests/ --export-env base
        env:
          YOLO_AUTOINSTALL: "false"
      - name: Save pytest-ranking cache
        id: save-pytest-ranking-cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranking_data
          key: pytest-ranking-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-${{ github.run_id }}
      - name: Prune uv Cache
        run: uv cache prune --ci
      - name: Upload report-log
        if: ${{ !cancelled() }}   # com mutante o step de teste falha; sem isso o arquivo não sobe
        uses: actions/upload-artifact@v4
        with:
          name: reportlog-${{ matrix.mode }}   # sem matriz: reportlog-main
          path: reportlog.jsonl
          retention-days: 14
          if-no-files-found: warn

